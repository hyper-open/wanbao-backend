<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>万宝AI助手 · 管理后台</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", "PingFang SC", sans-serif; background: #f5f6f8; color: #222; }
  header { background: #1f2937; color: #fff; padding: 12px 20px; display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .user-box { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 13px; }
  .user-box .who { opacity: .85; }
  /* 左侧菜单布局：header 固定顶部，下方 左菜单 + 右内容 */
  #app.show { display: flex; flex-direction: column; height: 100vh; }
  .layout { display: flex; flex: 1; min-height: 0; }
  #sidebar { width: 168px; flex-shrink: 0; background: #fff; border-right: 1px solid #e5e7eb; overflow-y: auto; padding: 8px 0 20px; }
  #sidebar .grp { font-size: 11px; color: #9ca3af; padding: 14px 16px 4px; user-select: none; }
  #sidebar button { display: block; width: 100%; text-align: left; background: none; border: none; border-left: 2px solid transparent; padding: 9px 16px; cursor: pointer; font-size: 14px; color: #374151; }
  #sidebar button:hover { background: #f3f4f6; }
  #sidebar button.active { color: #2563eb; background: #eff6ff; border-left-color: #2563eb; font-weight: 600; }
  main { flex: 1; min-width: 0; padding: 20px 24px; overflow-y: auto; }
  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 10px; flex-wrap: wrap; }
  .batch-bar { display: flex; justify-content: flex-start; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .btn { background: #2563eb; color: #fff; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; white-space: nowrap; }
  .btn:hover { background: #1d4ed8; }
  .btn.ghost { background: #e5e7eb; color: #374151; }
  .btn.danger { background: #dc2626; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  /* 表格：固定布局 + 长文本截断，避免列被挤爆 */
  .table-wrap { overflow-x: auto; background: #fff; border-radius: 8px; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
  table { width: 100%; border-collapse: collapse; background: #fff; }
  th, td { text-align: left; padding: 10px 12px; font-size: 13px; border-bottom: 1px solid #f1f2f4; vertical-align: middle; }
  th { background: #f9fafb; color: #6b7280; font-weight: 600; white-space: nowrap; }
  td.nowrap, th.nowrap { white-space: nowrap; }
  td.trunc { max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  td.actions { white-space: nowrap; }
  td.actions .btn { margin-right: 6px; }
  td.actions .btn:last-child { margin-right: 0; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; background: #dbeafe; color: #1d4ed8; white-space: nowrap; }
  .tag.warn { background: #fee2e2; color: #b91c1c; }
  .tag.ok { background: #dcfce7; color: #166534; }
  .mono { font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: none; align-items: flex-start; justify-content: center; padding-top: 40px; z-index: 50; }
  .modal-bg.show { display: flex; }
  .modal { background: #fff; border-radius: 10px; width: 640px; max-width: 94vw; max-height: 86vh; overflow: auto; padding: 20px; }
  .modal h3 { margin: 0 0 14px; font-size: 16px; }
  .field { margin-bottom: 10px; }
  .field label { display: block; font-size: 12px; color: #6b7280; margin-bottom: 4px; }
  .field input:not([type=checkbox]), .field textarea, .field select { width: 100%; padding: 8px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; }
  .field textarea { min-height: 90px; font-family: ui-monospace, Menlo, monospace; }
  .utip { cursor: help; border-bottom: 1px dashed #cbd5e1; }
.kpi-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .kpi { flex: 1; min-width: 110px; background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 14px 16px; }
  .kpi-num { font-size: 22px; font-weight: 700; }
  .chart { display: flex; align-items: flex-end; gap: 6px; height: 140px; padding: 8px 4px 0; background: #f8fafc; border-radius: 8px; }
  .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
  .bar-group { display: flex; align-items: flex-end; justify-content: center; gap: 3px; height: 100%; width: 100%; max-width: 34px; }
  .bar-stack { position: relative; flex: 1; height: 100%; display: flex; align-items: flex-end; }
  .bar { width: 100%; background: #2563eb; border-radius: 3px 3px 0 0; }
  .bar-cost { background: #f59e0b; }
  .bar-label { font-size: 10px; color: #6b7280; margin-top: 4px; white-space: nowrap; }
  .cat-stats { display: flex; flex-wrap: wrap; gap: 8rpx; margin-bottom: 12px; }
  .cstat { cursor: pointer; user-select: none; }
  .cstat:active { opacity: .7; }
  .cstat-on { background: var(--primary, #4f46e5); color: #fff; border-color: var(--primary, #4f46e5); }
  .uavatar { width: 22px; height: 22px; border-radius: 50%; object-fit: cover; vertical-align: -6px; margin-right: 6px; border: 1px solid #e2e8f0; }
  .secret-wrap { display: flex; gap: 6px; align-items: center; }
  .secret-wrap input { flex: 1; }
  .eye { cursor: pointer; color: #4f46e5; font-size: 12px; white-space: nowrap; user-select: none; }
  .field.row { display: flex; gap: 10px; }
  .field.row > div { flex: 1; }
  /* 活动参数：分组布局（邀请有奖等字段较多） */
  .camp-fields { display: flex; flex-wrap: wrap; gap: 10px; width: 100%; }
  .camp-fields .cf-sec { flex: 0 0 100%; font-size: 12px; font-weight: 600; color: #4f46e5; margin-top: 4px; }
  .camp-fields .cf-item { flex: 1 1 190px; min-width: 160px; }
  .camp-fields .cf-hint { flex: 0 0 100%; line-height: 1.6; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
  .msg { padding: 8px 12px; border-radius: 6px; margin-bottom: 12px; font-size: 13px; display: none; }
  .msg.ok { background: #dcfce7; color: #166534; display: block; }
  .msg.err { background: #fee2e2; color: #991b1b; display: block; }
  .muted { color: #9ca3af; font-size: 12px; }

  /* 筛选栏 */
  .filters { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; background: #fff; border-radius: 8px; padding: 12px 14px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
  .filters .f { display: flex; flex-direction: column; gap: 4px; }
  .filters label { font-size: 12px; color: #6b7280; }
  .filters input:not([type=checkbox]), .filters select { padding: 7px 9px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; min-width: 120px; }
  .filters .spacer { flex: 1; }
  /* 可点击文本链接 */
  .lnk { color: #2563eb; cursor: pointer; }
  .lnk:hover { text-decoration: underline; }
  /* 多选下拉（工具筛选等） */
  .ms { position: relative; }
  .ms-btn { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 7px 9px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; min-width: 160px; background: #fff; cursor: pointer; box-sizing: border-box; }
  .ms-btn .caret { color: #9ca3af; font-size: 10px; }
  .ms-panel { display: none; position: absolute; z-index: 30; top: 100%; left: 0; margin-top: 4px; width: 280px; background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.12); padding: 8px; box-sizing: border-box; }
  .ms.open .ms-panel { display: block; }
  .ms-search { width: 100%; box-sizing: border-box; margin-bottom: 6px; }
  .ms-list { max-height: 220px; overflow: auto; }
  .ms-item { display: flex; align-items: center; gap: 6px; padding: 5px 6px; border-radius: 6px; font-size: 13px; color: #111827; cursor: pointer; }
  .filters .ms-item { display: flex; align-items: center; gap: 6px; padding: 5px 6px; border-radius: 6px; font-size: 13px; color: #111827; cursor: pointer; }
  .ms-item:hover { background: #f3f4f6; }
  .ms-item input { min-width: 0; width: auto; }
  .ms-item .ms-id { margin-left: auto; }
  .ms-actions { display: flex; gap: 6px; justify-content: space-between; margin-top: 6px; border-top: 1px solid #f1f5f9; padding-top: 6px; }
  /* 弹窗内联展开（避免被 .modal 的 overflow 裁掉） */
  .ms-inline .ms-panel { position: static; width: auto; margin-top: 6px; box-shadow: none; }
  .ms-inline .ms-list { max-height: 160px; }

  /* 分页器 */
  .pager { display: flex; align-items: center; gap: 10px; justify-content: flex-end; margin-top: 12px; font-size: 13px; color: #6b7280; }
  .pager .btn { padding: 6px 12px; }

  /* 登录页 */
  #login { display: none; min-height: 100vh; align-items: center; justify-content: center; background: linear-gradient(135deg, #1e1b4b, #4c1d95); }
  #login.show { display: flex; }
  .login-card { background: #fff; border-radius: 14px; padding: 28px; width: 380px; max-width: 92vw; box-shadow: 0 20px 50px rgba(0,0,0,.3); }
  .login-card h2 { margin: 0 0 6px; font-size: 18px; }
  .login-card p { margin: 0 0 18px; font-size: 13px; color: #6b7280; }
  .login-card .field { margin-bottom: 12px; }
  .login-card .btn { width: 100%; padding: 10px; font-size: 14px; }
  #app { display: none; }
</style>
</head>
<body>

<!-- 登录页 -->
<div id="login">
  <div class="login-card">
    <h2>万宝AI助手 · 管理后台</h2>
    <p>请使用管理员账号登录</p>
    <div id="loginMsg" class="msg"></div>
    <div class="field"><label>用户名</label><input id="lg_user" placeholder="admin" /></div>
    <div class="field"><label>密码</label><input id="lg_pass" type="password" placeholder="请输入密码" /></div>
    <button class="btn" onclick="doLogin()">登录</button>
  </div>
</div>

<!-- 主体 -->
<div id="app">
<header>
  <h1>万宝AI助手 · 管理后台</h1>
  <span id="buildTag" class="muted" style="opacity:.6;font-size:11px;"></span>
  <div class="user-box">
    <span class="who" id="whoami"></span>
    <button class="btn ghost" onclick="openChangePw()">修改密码</button>
    <button class="btn ghost" onclick="logout()">退出</button>
  </div>
</header>
<div class="layout">
<aside id="sidebar">
  <div class="grp">总览</div>
  <button data-tab="dashboard" class="active">看板</button>
  <div class="grp">工具运营</div>
  <button data-tab="tools">工具</button>
  <button data-tab="categories">工具分类</button>
  <button data-tab="sessions">会话</button>
  <button data-tab="invocations">调用明细</button>
  <div class="grp">交易营销</div>
  <button data-tab="packages">充值档位</button>
  <button data-tab="campaigns">营销活动</button>
  <button data-tab="accounts">渠道账号</button>
  <button data-tab="orders">收款明细</button>
  <button data-tab="consumption">消费总览</button>
  <div class="grp">模型服务</div>
  <button data-tab="providers">LLM 供应商</button>
  <button data-tab="models">模型</button>
  <button data-tab="routing">路由</button>
  <button data-tab="monitor">监控</button>
  <div class="grp">用户与系统</div>
  <button data-tab="users">用户</button>
  <button data-tab="feedback">反馈</button>
  <button data-tab="admins">管理员</button>
</aside>
<main>
  <div id="msg" class="msg"></div>
  <div id="view"></div>
</main>
</div>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal" id="modal"></div>
</div>

<script>
const API = location.origin + "/api/admin";
// 供应商接口协议：当前网关仅实现 OpenAI 兼容客户端（gateway._client），故只有一项
const PROTOCOLS = ["openai-compatible"];
// 模型档位：用于标识「便宜档/高质量档」，seed 按 classifier→cost、executor→quality 生成
const TIERS = ["cost", "quality"];
const $ = (s) => document.querySelector(s);
let TOKEN = localStorage.getItem("wanbao_admin_token") || "";       // 管理员登录令牌
let ME = null;

function saveToken(v){ TOKEN = v; localStorage.setItem("wanbao_admin_token", v); }
function logout(){
  saveToken(""); ME = null;
  $("#app").classList.remove("show"); $("#login").classList.add("show");
}
function loginMsg(t, ok){
  const m = $("#loginMsg"); m.textContent = t; m.className = "msg " + (ok ? "ok" : "err");
}
async function doLogin(){
  const username = $("#lg_user").value.trim(), password = $("#lg_pass").value;
  if(!username || !password){ loginMsg("请输入用户名和密码", false); return; }
  try{
    const res = await fetch(API+"/login", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({username, password})});
    const data = await res.json();
    if(!res.ok) throw new Error(data.detail || "登录失败");
    saveToken(data.token); ME = data;
    enterApp();
  }catch(e){ loginMsg("登录失败：" + e.message, false); }
}
async function enterApp(){
  $("#login").classList.remove("show"); $("#app").classList.add("show");
  try{
    ME = await api("/me");
  }catch(e){ /* 令牌过期由 api() 统一处理 */ }
  $("#whoami").textContent = (ME && ME.username) ? ME.username : "";
  // 页面构建时间标记：用于确认浏览器拿到的是不是最新版本
  const bt = document.getElementById("buildTag");
  if (bt) bt.textContent = "build: " + document.lastModified;
  switchTab("dashboard");  // 登录后默认进看板
}
function openChangePw(){
  $("#modal").innerHTML = `<h3>修改密码</h3>
    <div class="field"><label>原密码</label><input id="pw_old" type="password"/></div>
    <div class="field"><label>新密码（至少 8 位）</label><input id="pw_new" type="password"/></div>
    <div class="modal-actions"><button class="btn ghost" onclick="closeModal()">取消</button>
      <button class="btn" onclick="saveChangePw()">保存</button></div>`;
  showModal();
}
async function saveChangePw(){
  try{
    await api("/password", {method:"POST", body:JSON.stringify({old_password:$("#pw_old").value, new_password:$("#pw_new").value})});
    showMsg("密码已修改，请重新登录", true); closeModal(); setTimeout(logout, 1200);
  }catch(e){ showMsg("修改失败: "+e.message, false); }
}

function headers(extra={}){
  const h = Object.assign({"Content-Type": "application/json"}, extra);
  if(TOKEN) h["Authorization"] = "Bearer " + TOKEN;
  return h;
}
function showMsg(t, ok){ const m=$("#msg"); m.textContent=t; m.className="msg "+(ok?"ok":"err"); setTimeout(()=>m.className="msg", 2500); }
async function api(path, opts={}){
  const res = await fetch(API+path, Object.assign({headers: headers()}, opts));
  if(res.status===401){
    showMsg("登录已过期，请重新登录", false);
    setTimeout(logout, 1000);
    throw new Error("401");
  }
  const ct = res.headers.get("content-type")||"";
  const data = ct.includes("json") ? await res.json() : await res.text();
  if(!res.ok) { const e = (data&&data.detail)||data||res.status; throw new Error(e); }
  return data;
}

// ---------- 工具 ----------
const TOOLS_FILTER = { q: "", category: "", enabled: "", channel: "", hot: "", executor: "", async_exec: "", interactive: "", attachment: "", sort_by: "", sort_dir: "desc", page: 1, size: 20 };
const TOOL_SEL = new Set();   // 勾选的工具 id（跨页保留，批量操作后清空）
let TOOL_PAGE_IDS = [];       // 当前页的工具 id（供全选/取消全选）
async function renderTools(){
  await loadToolOptions();
  await loadAccounts();
  const all = await loadTools(true);  // 全量缓存：供调用明细多选 / 分类统计
  const qs = new URLSearchParams(Object.entries(TOOLS_FILTER).filter(([,v])=>v!=="" && v!==null)).toString();
  const data = await api("/tools?" + qs);
  const list = data.items || [];
  TOOL_PAGE_IDS = list.map(t => t.id);
  const stats = data.category_stats || [];
  const statTotal = stats.reduce((a, s) => a + s.total, 0);
  const statEn = stats.reduce((a, s) => a + s.enabled, 0);
  const statDis = statTotal - statEn;
  let html = `<div class="cat-stats">
    <span class="tag cstat ${TOOLS_FILTER.category===""?"cstat-on":""}" onclick="TOOLS_FILTER.category=''; TOOLS_FILTER.page=1; renderTools()">全部 ${statTotal}（启 ${statEn} / 停 ${statDis}）</span>
    ${stats.map(s=>`<span class="tag cstat ${TOOLS_FILTER.category===s.category?"cstat-on":""}" onclick="TOOLS_FILTER.category='${esc(s.category)}'; TOOLS_FILTER.page=1; renderTools()">${esc(s.name)} ${s.total}（启 ${s.enabled} / 停 ${s.disabled}）</span>`).join("")}
  </div>`;
  html += `<div class="filters">
    <div class="f"><label>关键字（ID / 名称 / 描述）</label><input id="tl_q" value="${esc(TOOLS_FILTER.q)}" placeholder="如 简历"/></div>
    <div class="f"><label>分类</label><select id="tl_cat">
      ${[["","全部分类"]].concat((TOOL_OPTIONS.categories||[]).map(c=>[c.value,c.label])).map(([v,t])=>`<option value="${esc(v)}" ${TOOLS_FILTER.category===v?"selected":""}>${esc(t)}</option>`).join("")}
    </select></div>
    <div class="f"><label>渠道</label><select id="tl_chan">
      ${[["","全部"],["none","未绑定（全渠道可见）"]].concat((CHANNEL_ACCOUNTS||[]).map(a=>[a.id,a.name||a.id])).map(([v,t])=>`<option value="${esc(v)}" ${TOOLS_FILTER.channel===v?"selected":""}>${esc(t)}</option>`).join("")}
    </select></div>
    <div class="f"><label>状态</label><select id="tl_enabled">
      ${[["","全部"],["yes","启用"],["no","停用"]].map(([v,t])=>`<option value="${v}" ${TOOLS_FILTER.enabled===v?"selected":""}>${t}</option>`).join("")}
    </select></div>
    <div class="f"><label>热门</label><select id="tl_hot">
      ${[["","全部"],["yes","热门"],["no","非热门"]].map(([v,t])=>`<option value="${v}" ${TOOLS_FILTER.hot===v?"selected":""}>${t}</option>`).join("")}
    </select></div>
    <div class="f"><label>执行器</label><select id="tl_exec">
      ${[["","全部"],["none","纯配置"],["docx_export","Word 文档导出"],["docx_resume","Word 简历导出"],["pptx_resume","PPT 导出"]].map(([v,t])=>`<option value="${v}" ${TOOLS_FILTER.executor===v?"selected":""}>${t}</option>`).join("")}
    </select></div>
    <div class="f"><label>异步</label><select id="tl_async">
      ${[["","全部"],["yes","异步"],["no","同步"]].map(([v,t])=>`<option value="${v}" ${TOOLS_FILTER.async_exec===v?"selected":""}>${t}</option>`).join("")}
    </select></div>
    <div class="f"><label>互动</label><select id="tl_inter">
      ${[["","全部"],["yes","互动"],["no","一次性"]].map(([v,t])=>`<option value="${v}" ${TOOLS_FILTER.interactive===v?"selected":""}>${t}</option>`).join("")}
    </select></div>
    <div class="f"><label>附件</label><select id="tl_attach">
      ${[["","全部"],["yes","需附件"],["no","免附件"]].map(([v,t])=>`<option value="${v}" ${TOOLS_FILTER.attachment===v?"selected":""}>${t}</option>`).join("")}
    </select></div>
    <button class="btn" onclick="applyToolFilter()">筛选</button>
    <button class="btn ghost" onclick="resetToolFilter()">重置</button>
    <div class="spacer"></div>
    <span class="muted">共 ${data.total ?? list.length} 个</span>
    <label class="nowrap" style="user-select:none;cursor:pointer;"><input type="checkbox" id="streamToggle" onchange="toggleStream(this.checked)"/> 流式输出</label>
    <label class="nowrap" style="user-select:none;cursor:pointer;" title="关闭后 C 端工具详情页不展示免责横幅（专项+通用）"><input type="checkbox" id="discToggle" onchange="toggleDisclaimer(this.checked)"/> 免责声明</label>
    <label class="nowrap" style="user-select:none;cursor:pointer;" title="开启后全部 LLM 调用返回假数据（无需 API Key，仅开发调试用）"><input type="checkbox" id="llmMockToggle" onchange="toggleLlmMock(this.checked)"/> LLM Mock</label>
    <button class="btn ghost" onclick="runLimits()">⚙ 限流参数</button>
    <button class="btn ghost" onclick="openEmbedConfig()">🧠 向量</button>
    <button class="btn ghost" onclick="runToolHealth()">🩺 工具体检</button>
    <button class="btn" onclick="openTool()">+ 新建工具</button>
  </div>`;
  const pageAllSel = TOOL_PAGE_IDS.length > 0 && TOOL_PAGE_IDS.every(id => TOOL_SEL.has(id));
  html += `<div class="batch-bar"><span class="muted">已选 <b id="selCount">${TOOL_SEL.size}</b> 项</span>
    <button class="btn ghost batch-btn" ${TOOL_SEL.size?"":"disabled"} onclick="batchTools('enable')">批量启用</button>
    <button class="btn ghost batch-btn" ${TOOL_SEL.size?"":"disabled"} onclick="batchTools('disable')">批量停用</button>
    <button class="btn ghost batch-btn" ${TOOL_SEL.size?"":"disabled"} onclick="batchTools('hot')">批量热门</button>
    <button class="btn ghost batch-btn" ${TOOL_SEL.size?"":"disabled"} onclick="batchTools('unhot')">批量取消热门</button>

function userTip(u){

}
function uidCell(id, u, extra){

  const av = (u && u.avatar) ? `<img class="uavatar" src="/api/admin/user-avatar/${id}?token=${encodeURIComponent(TOKEN)}" onerror="this.remove()">` : "";

function discountLabel(d){ const n = Number(d) * 10; return (Math.round(n*10)/10) + " 折"; }
function campaignStatus(c){
  const now = new Date();
  const start = c.start_at ? new Date(c.start_at) : null;
  const end = c.end_at ? new Date(c.end_at) : null;
  if(!c.enabled) return '<span class="tag warn">已停用</span>';
  if(start && start > now) return '<span class="tag">未开始</span>';
  if(end && end <= now) return '<span class="tag warn">已结束</span>';
  return '<span class="tag ok">生效中</span>';
}
const CTYPE_LABEL = { discount:"充值优惠", invite:"邀请有奖", checkin:"签到奖励" };
function ctypeLabel(t){ return CTYPE_LABEL[t] || t || "充值优惠"; }
function campaignParamsText(c){
  const cfg = c.config || {};
  if(c.type === "invite"){
    const days = cfg.first_recharge_days ?? 30;
    return `① 注册即送 ${cfg.reward_quota ?? 1} 积分（日 ${cfg.invite_daily_cap ?? 10}/月 ${cfg.invite_monthly_cap ?? 100}）`
      + ` · ② 首充加奖 ${cfg.recharge_percent ?? 10}%${days ? "（" + days + " 天内首充）" : "（不限时）"}（日 ${cfg.recharge_daily_cap ?? 10}/月 ${cfg.recharge_monthly_cap ?? 100}）`
      + ` · 奖励 ${cfg.valid_days ?? 30} 天有效`;
  }
  if(c.type === "checkin") return `每日签到送 ${cfg.quota ?? 1} 积分 · ${(cfg.valid_days ?? 30) ? (cfg.valid_days ?? 30) + " 天有效" : "不过期"}`;
  // 充值优惠：两种方式
  if(cfg.mode === "bonus") return `送积分 ${cfg.bonus_percent ?? 10}%（充值积分的百分比）`;
  return `打折 ${discountLabel(c.discount)}`;
}

// ---------- 供应商 / 模型 ----------
async function renderProviders(){
  const list = await api("/providers");
  let html = `<div class="toolbar"><button class="btn" onclick="openProv()">+ 新建供应商</button></div><div class="table-wrap"><table>
    <thead><tr><th>ID</th><th class="nowrap">名称</th><th class="nowrap">接口协议</th><th>Base URL</th><th class="nowrap">优先级</th><th class="nowrap">备案号</th><th class="nowrap">有效模型/总数</th><th class="nowrap">启用</th><th class="nowrap">操作</th></tr></thead><tbody>`;
  for(const p of list){
    const cnt = p.model_count ? `${p.effective_model_count}/${p.model_count}` : "-";
    const disabledNote = (!p.enabled && p.model_count) ? `<span class="muted"> ${p.model_count} 个模型失效</span>` : "";
    html += `<tr><td class="mono nowrap">${esc(p.id)}</td><td class="nowrap">${esc(p.name)}</td><td class="nowrap">${esc(p.type)}</td>
      <td class="mono trunc" title="${esc(p.base_url||"")}">${esc(p.base_url||"-")}</td>
      <td class="nowrap">${p.priority}</td>
      <td class="mono trunc" title="${esc(p.filing_no||"")}">${p.filing_no?esc(p.filing_no):'<span class="muted">未填写</span>'}</td>
      <td class="nowrap">${p.enabled?cnt:`<span class="tag warn">${cnt}</span>`}</td>
      <td class="nowrap">${p.enabled?'<span class="tag">启用</span>':'<span class="tag warn">停用</span>'}${disabledNote}</td>
      <td class="actions"><button class="btn ghost" onclick="openProv('${esc(p.id)}')">编辑</button>
        ${p.enabled
          ? `<button class="btn ghost" onclick="toggleProv('${esc(p.id)}',false)">停用</button>`
          : `<button class="btn ghost" onclick="toggleProv('${esc(p.id)}',true)">启用</button>`}
        <button class="btn danger" onclick="delProv('${esc(p.id)}')">删除</button></td></tr>`;
  }
  html += `</tbody></table></div><p class="muted">「有效模型/总数」= 该供应商下真正参与调用的模型数 / 全部模型数；供应商停用时有效数为 0（模型自身设置不会被改写，重新启用即恢复）。</p>`;
  $("#view").innerHTML = html;
}
let PROV_EDIT = null;   // 当前编辑的供应商（用于停用前确认影响面）

    <div class="field row"><div><label>优先级</label><input id="pv_pri" type="number" value="${p.priority}"/></div><div><label>超时(ms)</label><input id="pv_to" type="number" value="${p.timeout_ms}"/></div>

async function saveProv(id){
  const body={name:$("#pv_name").value,type:$("#pv_type").value,base_url:$("#pv_url").value,api_key:$("#pv_key").value,
    filing_subject:$("#pv_subject").value||null,
    filing_no:$("#pv_filing").value||null,
    filing_source_url:$("#pv_fsrc").value||null,
    filing_checked_at:$("#pv_fat").value||null,
    priority:Number($("#pv_pri").value),timeout_ms:Number($("#pv_to").value),enabled:$("#pv_en").checked};
  if(!id){ body.id=$("#pv_id").value; if(!body.id){showMsg("ID 必填",false);return;} }
  // 停用前确认：会使其下启用中的模型立即失效，甚至打断整条降级链
  if(id && PROV_EDIT && PROV_EDIT.enabled && !body.enabled && !confirmDisable(PROV_EDIT.name || id, PROV_EDIT)) return;
  try{ if(id) await api("/providers/"+id,{method:"PUT",body:JSON.stringify(body)}); else await api("/providers",{method:"POST",body:JSON.stringify(body)});
    showMsg("已保存",true); closeModal(); renderProviders(); }catch(e){ showMsg("保存失败: "+e.message,false); }
}
// 停用确认文案（供应商）：把「会影响什么」说清楚
function confirmDisable(name, info){
  const n = info.model_enabled_count || 0;
  const broken = info.disable_breaks_roles || [];
  if(!n && !broken.length) return true;
  const lines = [`确认停用供应商「${name}」？`];
  if(n) lines.push(`• 其下 ${n} 个启用中的模型将立即失效、不再参与调用（设置会保留）`);
  if(broken.length) lines.push(`• 角色 ${broken.join(" / ")} 的降级链将没有可用节点，相关 AI 调用会直接报错`);
  return confirm(lines.join("\n"));
}
// 操作列快捷启停：不需进编辑弹窗
async function toggleProv(id, next){
  try{
    if(!next){
      const p = await api("/providers/"+id);   // 取最新影响面
      if(!confirmDisable(p.name || id, p)) return;
    }
    await api("/providers/"+id, {method:"PUT", body:JSON.stringify({enabled: next})});
    showMsg(next ? "已启用" : "已停用", true);
    renderProviders();
  }catch(e){ showMsg("操作失败: "+e.message, false); }
}
async function toggleModel(id, next){
  try{
    if(!next){
      const m = await api("/models/"+id);
      const broken = m.disable_breaks_roles || [];
      const ch = m.chains || [];
      let msg = `确认停用模型「${m.model_actual}」？`;
      if(broken.length) msg += `\n• 角色 ${broken.join(" / ")} 的降级链将没有可用节点，相关 AI 调用会直接报错`;
      else if(ch.length) msg += `\n• 它当前在降级链 ${ch.join(" / ")} 中，停用后该节点会被跳过（链上其他节点仍可兜底）`;
      else msg += `\n• 它未用于任何降级链，停用不影响调用`;
      if(!confirm(msg)) return;
    }
    await api("/models/"+id, {method:"PUT", body:JSON.stringify({enabled: next})});
    showMsg(next ? "已启用" : "已停用", true);
    renderModels();
  }catch(e){ showMsg("操作失败: "+e.message, false); }
}
async function delProv(id){ if(!confirm("确认删除？")) return; try{ await api("/providers/"+id,{method:"DELETE"}); showMsg("已删除",true); renderProviders(); }catch(e){ showMsg("删除失败: "+e.message,false);} }

async function renderModels(){
  const list = await api("/models");
  let html = `<div class="toolbar"><button class="btn" onclick="openModel()">+ 新建模型</button></div><div class="table-wrap"><table>
    <thead><tr><th>ID</th><th class="nowrap">供应商</th><th>实际模型名</th><th class="nowrap">所属链</th><th class="nowrap">档位</th><th class="nowrap">单价/1k</th><th class="nowrap">有效状态</th><th class="nowrap">操作</th></tr></thead><tbody>`;
  for(const m of list){
    let st;
    if(m.effective_enabled) st = '<span class="tag">启用</span>';
    else if(m.enabled) st = '<span class="tag warn" title="所属供应商已停用，该模型不会参与调用">失效</span><span class="muted"> 供应商停用</span>';
    else st = '<span class="tag warn">停用</span>';
    const ch = (m.chains||[]).length ? esc(m.chains.join(" + ")) : '<span class="tag warn">未用于任何链</span>';
    const caps = m.capabilities || (m.supports_vision ? {vision:true} : {});
    const CAP_NAMES = {vision:"视觉", function_call:"工具", audio_in:"音频", tts:"TTS"};
    const capTags = Object.keys(CAP_NAMES).filter(c=>caps[c]).map(c=>'<span class="tag">'+CAP_NAMES[c]+'</span>').join(" ");
    html += `<tr><td>${m.id}</td><td class="mono nowrap">${esc(m.provider_id)}${m.provider_enabled?"":'<span class="tag warn">停用</span>'}</td><td class="mono trunc" title="${esc(m.model_actual)}">${esc(m.model_actual)}${capTags?" "+capTags:""}</td>
      <td class="nowrap">${ch}</td><td class="nowrap">${esc(m.tier||"")}</td><td class="nowrap">${m.price_per_1k}</td>
      <td class="nowrap">${st}</td>
      <td class="actions"><button class="btn ghost" onclick="openModel(${m.id})">编辑</button>
        ${m.enabled
          ? `<button class="btn ghost" onclick="toggleModel(${m.id},false)">停用</button>`
          : `<button class="btn ghost" onclick="toggleModel(${m.id},true)">启用</button>`}
        <button class="btn danger" onclick="delModel(${m.id})">删除</button></td></tr>`;
  }
  html += `</tbody></table></div>
    <p class="muted">「有效状态」= 供应商启用 且 模型启用（与调用链判定一致）；供应商停用时显示「失效」，模型自身设置保留，供应商重新启用即恢复。</p>
    <p class="muted">「所属链」= 该模型当前被哪些角色的降级链引用（模型不绑定角色，配一次即可被多条链复用；到「路由」页增删）。显示「未用于任何链」表示它还没被任何角色使用。</p>
    <p class="muted">「档位」是成本档（cost）/ 质量档（quality）的标识，当前仅用于展示与人工区分，不参与路由决策。</p>`;
  $("#view").innerHTML = html;
}
let MODEL_EDIT = null;      // 当前编辑的模型（用于对比角色勾选变化与影响面）
let MODEL_ROLES = [];       // 可选角色（来自 /routing）
async function openModel(id){
  let m, provs, routing;
  try{
    m = id ? await api("/models/"+id) : {provider_id:"",model_actual:"",alias:"",tier:"quality",price_per_1k:0.01,enabled:true,supports_vision:false,capabilities:{},chains:[]};
    provs = await api("/providers");
    routing = await api("/routing");
  }catch(e){ showMsg("打开失败: "+e.message, false); return; }
  MODEL_EDIT = id ? m : null;
  MODEL_ROLES = (routing.roles || []).map(r=>r.role);
  const caps = m.capabilities || (m.supports_vision ? {vision:true} : {});
  const opts = provs.map(p=>`<option value="${p.id}" ${p.id===m.provider_id?"selected":""}>${esc(p.id)}${p.enabled?"":"（已停用）"}</option>`).join("");
  const cur = m.chains || [];
  const roleBoxes = MODEL_ROLES.map(r=>`<label style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:400;">
      <input type="checkbox" class="m_chain" value="${esc(r)}" ${cur.indexOf(r)>=0?"checked":""}/> ${esc(ROLE_LABELS[r] || r)}</label>`).join("");
  $("#modal").innerHTML = `<h3>${id?"编辑模型":"新建模型"}</h3>
    <div class="field"><label>供应商</label><select id="m_prov">${opts}</select></div>
    <div class="field"><label>实际模型名</label><input id="m_actual" value="${esc(m.model_actual)}"/></div>
    <div class="field row">
      <div><label>档位（成本档/质量档，标识用）</label><select id="m_tier">${selectOpts(TIERS, m.tier)}</select></div>
      <div><label>单价/1k</label><input id="m_price" type="number" step="0.001" value="${m.price_per_1k}"/></div></div>
    <div class="field"><label>参与角色（可多选）</label>
      <div style="display:flex;gap:18px;padding:4px 0;">${roleBoxes || '<span class="muted">（暂无可选角色）</span>'}</div>
      <p class="muted" style="margin:4px 0 0;">这是模型归属的<b>唯一入口</b>：勾选即加入对应角色的降级链（追加到链尾），取消勾选则移出；「路由」页只负责调整顺序。同一模型可同时参与多个角色，无需重复建记录。</p>
    </div>
    <div class="field"><label><input type="checkbox" id="m_en" ${m.enabled?"checked":""}/> 启用</label>
      <label style="margin-left:18px;"><input type="checkbox" class="m_cap" value="vision" ${caps.vision?"checked":""}/> 支持视觉</label>
      <label style="margin-left:12px;"><input type="checkbox" class="m_cap" value="function_call" ${caps.function_call?"checked":""}/> 支持工具调用</label>
      <label style="margin-left:12px;"><input type="checkbox" class="m_cap" value="audio_in" ${caps.audio_in?"checked":""}/> 支持音频输入</label>
      <p class="muted" style="margin:4px 0 0;">含图请求只路由到「支持视觉」模型；工具调用（多轮追问的检测器）只路由到「支持工具调用」模型。</p></div>
    <div class="field row">
      <div><label>备案的模型/算法名称（公示用）</label><input id="m_fname" value="${esc(m.filing_name||"")}"/></div>
      <div><label>备案号</label><input id="m_fno" value="${esc(m.filing_no||"")}"/></div>
    </div>
    <div class="field row">
      <div><label>核对来源链接</label><input id="m_fsrc" value="${esc(m.filing_source_url||"")}"/></div>
      <div><label>核对时间</label><input id="m_fat" value="${esc((m.filing_checked_at||"").slice(0,19))}" placeholder="YYYY-MM-DD HH:MM:SS"/></div>
    </div>
    <div class="modal-actions"><button class="btn ghost" onclick="closeModal()">取消</button><button class="btn" onclick="saveModel(${id||""})">保存</button></div>`;
  showModal();
}
async function saveModel(id){
  const capSet = {};
  document.querySelectorAll(".m_cap:checked").forEach(e=>capSet[e.value]=true);
  const body={provider_id:$("#m_prov").value,model_actual:$("#m_actual").value,tier:$("#m_tier").value,
    price_per_1k:Number($("#m_price").value),enabled:$("#m_en").checked,
    capabilities:capSet,supports_vision:!!capSet.vision,
    filing_name:$("#m_fname").value||null,filing_no:$("#m_fno").value||null,
    filing_source_url:$("#m_fsrc").value||null,filing_checked_at:$("#m_fat").value||null};
  const want = Array.from(document.querySelectorAll(".m_chain:checked")).map(e=>e.value);
  const cur = (MODEL_EDIT && MODEL_EDIT.chains) || [];
  const roleChanged = (want.length !== cur.length) || want.some(r=>cur.indexOf(r) < 0);
  // 取消勾选会让某角色的链失去唯一可用节点时先确认
  if(id && roleChanged){
    const breaking = cur.filter(r=>want.indexOf(r) < 0 && ((MODEL_EDIT && MODEL_EDIT.disable_breaks_roles) || []).indexOf(r) >= 0);
    if(breaking.length && !confirm(`取消勾选「${breaking.join(" / ")}」后，该角色的降级链将没有可用节点，相关 AI 调用会直接报错。\n\n确认继续？`)) return;
  }
  try{
    let saved;
    if(id) saved = await api("/models/"+id,{method:"PUT",body:JSON.stringify(body)});
    else saved = await api("/models",{method:"POST",body:JSON.stringify(body)});
    // 角色勾选有变化再同步降级链（新建模型此时才有 id）
    if(roleChanged || !id){
      await api(`/models/${saved.id}/chains`, {method:"PUT", body:JSON.stringify({chains: want})});
    }
    showMsg("已保存",true); closeModal(); renderModels();
  }catch(e){ showMsg("保存失败: "+e.message,false); }
}
async function delModel(id){ if(!confirm("确认删除？")) return; try{ await api("/models/"+id,{method:"DELETE"}); showMsg("已删除",true); renderModels(); }catch(e){ showMsg("删除失败: "+e.message,false);} }

// ---------- 路由 ----------
let ROUTING = null;   // {roles} 本地工作副本（只改顺序，改完统一保存）

function _routingRole(role){ return ROUTING.roles.find(r=>r.role===role); }

async function renderRouting(){
  ROUTING = await api("/routing");
  renderRoutingView();
}

const ROLE_LABELS = {classifier:"意图识别", executor:"工具执行", embedding:"向量嵌入",
  "executor.vision":"工具执行 · 视觉", "executor.audio_in":"工具执行 · 音频",
  "executor.function_call":"工具执行 · 工具调用"};

function renderRoutingView(){
  let html = `<p class="muted">降级链：执行时自上而下依次尝试，失败自动降级到下一个节点。此处<b>只调整顺序</b>（↑ ↓）或<b>移出节点</b>；<b>新增成员请到「模型」页勾选该模型的「参与角色」</b>——归属只有一个入口，避免两处不一致。<b>「失效」节点不会参与调用</b>（其供应商或模型已停用，请到「LLM 供应商/模型」页恢复）。</p>`;
  for(const r of ROUTING.roles){
    const live = r.chain.filter(n=>n.effective).length;
    html += `<div style="border:1px solid #e5e7eb;border-radius:8px;padding:12px;margin-bottom:14px;">
      <h3 style="margin:0 0 10px;font-size:14px;">${esc(ROLE_LABELS[r.role] || r.role)} 降级链 <span class="mono muted" style="font-size:11px;">${esc(r.role)}</span>
        <span class="muted">（${r.chain.length} 个节点，其中 ${live} 个生效）</span></h3>`;
    if(!r.chain.length) html += `<p class="muted">暂无节点 —— 到「模型」页勾选某模型的「参与角色」，它就会出现在这里</p>`;
    r.chain.forEach((n,i)=>{
      let badge, why = "";
      if(n.missing){ badge = '<span class="tag warn">模型缺失</span>'; }
      else if(n.effective){ badge = '<span class="tag ok">生效</span>'; }
      else{
        badge = '<span class="tag warn">失效</span>';
        const rs = [];
        if(!n.provider_enabled) rs.push("供应商停用");
        if(!n.enabled) rs.push("模型停用");
        why = `<span class="muted">（${rs.join("、")}）</span>`;
      }
      html += `<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #f3f4f6;">
        <span class="muted" style="width:20px;">${i+1}</span>
        <span class="mono" style="flex:1;">${esc(n.label||"")}${n.tier?` <span class="muted">[${esc(n.tier)}]</span>`:""} ${badge} ${why}</span>
        <button class="btn ghost" onclick="routingMove('${esc(r.role)}',${i},-1)" ${i===0?"disabled":""}>↑</button>
        <button class="btn ghost" onclick="routingMove('${esc(r.role)}',${i},1)" ${i===r.chain.length-1?"disabled":""}>↓</button>
        <button class="btn ghost" title="等同于在「模型」页取消勾选该角色的「参与角色」" onclick="routingRemove('${esc(r.role)}',${i})">移出</button></div>`;
    });
    html += `</div>`;
  }
  html += `<p class="muted">调整顺序与移出都是<b>即时生效</b>的，无需再点保存。</p>`;
  $("#view").innerHTML = html;
}
// 顺序/移出都即时落库（避免"改了但没保存"的困惑）
async function _saveRoleChain(role){
  const r = _routingRole(role); if(!r) return;
  try{
    await api("/routing/"+role, {method:"PUT", body:JSON.stringify({chain: r.chain.map(n=>({model_id:n.model_id}))})});
    showMsg(`${role} 链已更新`, true);
  }catch(e){
    showMsg("更新失败: "+e.message, false);
  }
  renderRouting();   // 无论成败都重新拉取，保证界面与服务端一致
}
function routingMove(role, idx, delta){
  const r = _routingRole(role); const j = idx + delta;
  if(!r || j < 0 || j >= r.chain.length) return;
  [r.chain[idx], r.chain[j]] = [r.chain[j], r.chain[idx]];
  renderRoutingView();          // 先本地渲染，点击即时反馈
  _saveRoleChain(role);         // 再落库
}
function routingRemove(role, idx){
  const r = _routingRole(role); if(!r) return;
  const node = r.chain[idx];
  // 若这是该角色最后一个「生效」节点，移出会让整条链失效，先确认
  const live = r.chain.filter(n=>n.effective).length;
  if(node && node.effective && live <= 1){
    if(!confirm(`移出后「${role}」的降级链将没有可用节点，相关 AI 调用会直接报错。\n\n确认移出？`)) return;
  }
  r.chain.splice(idx, 1);
  renderRoutingView();
  _saveRoleChain(role);
}

function payLabel(o){ return o ? (o.payment_provider_label || o.payment_provider || "-") : "-"; }
function orderStatusTag(s){
  if(s === "paid") return '<span class="tag ok">已支付</span>';
  if(s === "pending") return '<span class="tag warn">待支付</span>';
  if(s === "canceled" || s === "cancelled") return '<span class="tag warn">已取消</span>';
  if(s === "closed") return '<span class="tag">已关闭</span>';
  if(s === "refunded") return '<span class="tag warn">已退款</span>';
  return `<span class="tag">${esc(s)}</span>`;
}
// 调用状态标签由后端下发（status_label）；这里按状态决定配色
function invStatusTag(i){
  const t = esc((i && (i.status_label || i.status)) || "");
  const s = i && i.status;
  if(s === "success") return `<span class="tag ok">${t}</span>`;
  if(s === "failed") return `<span class="tag warn">${t}</span>`;
  if(s === "pending" || s === "running") return `<span class="tag warn">${t}</span>`;
  return `<span class="tag">${t}</span>`;
}

function selectOptsL(items, cur){

// 批量操作：勾选 → 批量启用/停用/热门/渠道/删除（POST /tools/batch）
function toggleToolSel(id, on){
  if(on) TOOL_SEL.add(id); else TOOL_SEL.delete(id);
  updateBatchBar();
}
function updateBatchBar(){
  const c = $("#selCount"); if (c) c.textContent = TOOL_SEL.size;
  document.querySelectorAll(".batch-btn").forEach(b => b.disabled = TOOL_SEL.size === 0);
  const head = document.querySelector(".table-wrap thead input[type=checkbox]");
  if (head) head.checked = TOOL_PAGE_IDS.length > 0 && TOOL_PAGE_IDS.every(id => TOOL_SEL.has(id));
}
// 表头排序：同字段切换方向，新字段按语义给默认方向（名称升序，其余最新在前）
function toolSort(fd){
  if(TOOLS_FILTER.sort_by === fd){
    TOOLS_FILTER.sort_dir = TOOLS_FILTER.sort_dir === "asc" ? "desc" : "asc";
  } else {
    TOOLS_FILTER.sort_by = fd;
    TOOLS_FILTER.sort_dir = fd === "name" ? "asc" : "desc";
  }
  TOOLS_FILTER.page = 1;
  renderTools();
}
function toggleAllToolSel(on){
  TOOL_PAGE_IDS.forEach(id => { if(on) TOOL_SEL.add(id); else TOOL_SEL.delete(id); });
  renderTools();  // 重建表格让勾选框与集合一致
}
async function batchTools(action){
  const ids = Array.from(TOOL_SEL);
  if(!ids.length){ showMsg("请先勾选工具", false); return; }
  if(action==="delete"){ openBatchDeleteConfirm(ids); return; }
  await doBatchTools(action, ids);
}
function openBatchDeleteConfirm(ids){

// ---------- 通用查询串构造（支持数组值 → 重复参数） ----------
// ⚠️ 约定：筛选对象的键名必须与后端接口的参数名一致（如 tool_id / account / date_from），
//    否则参数会被后端静默忽略、筛选看似不生效。数组值 → 同名重复参数（如 tool_id=a&tool_id=b）。
function buildQs(f){
  const p = new URLSearchParams();
  for(const [k,v] of Object.entries(f)){
    if(v === "" || v == null) continue;
    if(Array.isArray(v)){ v.forEach(x=>{ if(x !== "" && x != null) p.append(k, x); }); continue; }
    p.append(k, v);
  }
  return p;
}

// ---------- 通用多选下拉 ----------
// items=[{value,label,desc?}]；selected=[value]；opts={allText,inline,searchPlaceholder}
function multiSelect(msId, label, items, selected, opts){
  opts = opts || {};
  const sel = selected || [];
  const list = items || [];
  const txt = msSummary(sel, list, opts.allText || "全部");
  const rows = list.map(it=>{
    const on = sel.indexOf(it.value) >= 0;
    return `<label class="ms-item" data-q="${esc(((it.label||"")+" "+(it.value||"")).toLowerCase())}">
      <input type="checkbox" value="${esc(it.value)}" ${on?"checked":""} onchange="msRefreshText('${msId}')"/>
      <span>${esc(it.label||it.value)}</span>${it.desc?`<span class="muted ms-id">${esc(it.desc)}</span>`:""}</label>`;
  }).join("");
  return `<div class="f ms${opts.inline?" ms-inline":""}" id="${msId}" data-all="${esc(opts.allText||"全部")}">
    <label>${esc(label)}</label>
    <div class="ms-btn" onclick="msToggle('${msId}')"><span class="ms-txt">${esc(txt)}</span><span class="caret">▼</span></div>
    <div class="ms-panel">
      <input class="ms-search" placeholder="${esc(opts.searchPlaceholder||"搜索…")}" oninput="msFilter('${msId}', this.value)"/>
      <div class="ms-list">${rows || '<div class="muted" style="padding:6px;">无可选项</div>'}</div>
      <div class="ms-actions">
        <button class="btn ghost" onclick="msClear('${msId}')">清空</button>
        <button class="btn" onclick="msToggle('${msId}')">确定</button>
      </div>
    </div>
  </div>`;
}
function msSummary(sel, items, allText){
  if(!sel.length) return allText;
  if(sel.length === 1){ const it = (items||[]).find(x=>x.value===sel[0]); return it ? it.label : sel[0]; }
  return `已选 ${sel.length} 项`;
}
function msEl(msId){ return document.getElementById(msId); }
function msChecked(msId){ const el = msEl(msId); return el ? Array.from(el.querySelectorAll(".ms-list input:checked")).map(cb=>cb.value) : []; }
function msToggle(msId){
  const el = msEl(msId); if(!el) return;
  const open = el.classList.toggle("open");
  if(open){ const s = el.querySelector(".ms-search"); if(s) setTimeout(()=>s.focus(), 0); }
}
function msRefreshText(msId){
  const el = msEl(msId); if(!el) return;
  const t = el.querySelector(".ms-txt"); if(!t) return;
  const checks = el.querySelectorAll(".ms-list input:checked");
  if(checks.length === 0) t.textContent = el.dataset.all || "全部";
  else if(checks.length === 1) t.textContent = checks[0].closest(".ms-item").querySelector("span").textContent;
  else t.textContent = `已选 ${checks.length} 项`;
}
function msClear(msId){
  const el = msEl(msId); if(!el) return;
  el.querySelectorAll(".ms-list input").forEach(cb=>{ cb.checked = false; });
  msRefreshText(msId);
}
function msFilter(msId, kw){
  kw = (kw || "").trim().toLowerCase();
  const el = msEl(msId); if(!el) return;
  el.querySelectorAll(".ms-item").forEach(it=>{
    it.style.display = (!kw || (it.dataset.q||"").includes(kw)) ? "" : "none";
  });
}

    <button class="btn" onclick="openAdmin()">+ 新建管理员</button></div><div class="table-wrap"><table>
    <thead><tr><th>ID</th><th class="nowrap">用户名</th><th class="nowrap">姓名</th><th class="nowrap">角色</th><th class="nowrap">状态</th><th class="nowrap">最近登录</th><th class="nowrap">创建时间</th><th class="nowrap">操作</th></tr></thead><tbody>`;
  for(const a of list){
    html += `<tr><td>${a.id}</td><td class="nowrap">${esc(a.username)}</td><td class="nowrap">${esc(a.name||'-')}</td>
      <td class="nowrap">${esc(a.role||'')}</td>
      <td class="nowrap">${a.status==='disabled'?'<span class="tag warn">已停用</span>':'<span class="tag ok">正常</span>'}</td>
      <td class="mono nowrap">${esc((a.last_login_at||"-").replace("T"," ").slice(0,16))}</td>
      <td class="mono nowrap">${esc((a.created_at||"").replace("T"," ").slice(0,16))}</td>
      <td class="actions">
        <button class="btn ghost" onclick="openAdmin(${a.id})">改密/编辑</button>
        <button class="btn ghost" onclick="toggleAdmin(${a.id}, '${a.status==='disabled'?'active':'disabled'}')">${a.status==='disabled'?'启用':'停用'}</button>
        <button class="btn danger" onclick="delAdmin(${a.id})">删除</button></td></tr>`;
  }
  html += `</tbody></table></div>`;
  $("#view").innerHTML = html;
}
async function openAdmin(id){
  let a = {username:"",name:"",role:"admin",password:""};
  if(id){ const list = await api("/admins"); a = list.find(x=>x.id===id) || a; }
  $("#modal").innerHTML = `<h3>${id?"编辑管理员 #"+id:"新建管理员"}</h3>
    <div class="field"><label>用户名（唯一，创建后不可改）</label><input id="a_user" value="${esc(a.username)}" ${id?"disabled":""}/></div>
    <div class="field row"><div><label>姓名</label><input id="a_name" value="${esc(a.name||"")}"/></div>
      <div><label>角色</label><input id="a_role" value="${esc(a.role||"admin")}"/></div></div>
    <div class="field"><label>${id?"重置密码（留空则不修改）":"密码（至少 8 位）"}</label><input id="a_pass" type="password"/></div>
    <div class="modal-actions"><button class="btn ghost" onclick="closeModal()">取消</button>
      <button class="btn" onclick="saveAdmin(${id||""})">保存</button></div>`;
  showModal();
}
async function saveAdmin(id){
  const body = {name:$("#a_name").value, role:$("#a_role").value, password:$("#a_pass").value};
  try{
    if(id){ await api("/admins/"+id, {method:"PUT", body:JSON.stringify(body)}); }
    else{
      body.username = $("#a_user").value.trim();
      if(!body.username){ showMsg("用户名必填", false); return; }
      if((body.password||"").length < 8){ showMsg("密码至少 8 位", false); return; }
      await api("/admins", {method:"POST", body:JSON.stringify(body)});
    }
    showMsg("已保存", true); closeModal(); renderAdmins();
  }catch(e){ showMsg("保存失败: "+e.message, false); }
}
async function toggleAdmin(id, status){
  try{ await api("/admins/"+id, {method:"PUT", body:JSON.stringify({status})}); renderAdmins(); }
  catch(e){ showMsg("操作失败: "+e.message, false); }
}
async function delAdmin(id){
  if(!confirm("确认删除该管理员账号？")) return;
  try{ await api("/admins/"+id, {method:"DELETE"}); showMsg("已删除", true); renderAdmins(); }
  catch(e){ showMsg("删除失败: "+e.message, false); }
}

// ---------- 通用 ----------
function pagerHTML(data, stateName){
  const total = data.total || 0, size = data.size || 20, page = data.page || 1;
  const pages = Math.max(1, Math.ceil(total / size));
  const rerender = {U_FILTER:"renderUsers()", FB_FILTER:"renderFeedback()", ORD_FILTER:"renderOrders()", TX_FILTER:"renderTransactions()", CONS_FILTER:"renderConsumption()", INV_FILTER:"renderInvocations()", S_FILTER:"renderSessions()", TOOLS_FILTER:"renderTools()"}[stateName] || "renderFeedback()";
  return `<div class="pager">
    <span>共 ${total} 条 · 第 ${page}/${pages} 页</span>
    <select onchange="${stateName}.size=Number(this.value); ${stateName}.page=1; ${rerender}">
      ${[10,20,50,100].map(n=>`<option value="${n}" ${size===n?"selected":""}>${n} 条/页</option>`).join("")}
    </select>
    <button class="btn ghost" ${page<=1?"disabled":""} onclick="${stateName}.page=${page-1}; ${rerender}">上一页</button>
    <button class="btn ghost" ${page>=pages?"disabled":""} onclick="${stateName}.page=${page+1}; ${rerender}">下一页</button>
  </div>`;
}
// ---------- 通用「表头排序」（服务端排序，作用于全部数据而非当前页） ----------
// 各列表 state 是模块级 const，这里在调用时（脚本已加载完）再取，避免 TDZ。
function _filterState(name){
  return { INV_FILTER, ORD_FILTER, TX_FILTER, CONS_FILTER, S_FILTER, U_FILTER, FB_FILTER }[name];
}
function thSort(stateName, rerender, key, label){
  const st = _filterState(stateName) || {};
  const arrow = st.sort === key ? (st.dir === "asc" ? " ▲" : " ▼") : "";
  return `<th style="cursor:pointer;user-select:none;white-space:nowrap;" title="点击排序" onclick="toggleSort('${stateName}','${rerender}','${key}')">${label}${arrow}</th>`;
}
function toggleSort(stateName, rerender, key){
  const st = _filterState(stateName);
  if(!st) return;
  if(st.sort === key) st.dir = st.dir === "asc" ? "desc" : "asc";
  else { st.sort = key; st.dir = "desc"; }
  st.page = 1;
  (window[rerender] || function(){})();
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])); }// 生成 <select> 选项；当前值不在候选里时保留它（避免一打开编辑就把历史值丢掉）
function selectOpts(values, cur){ const all = values.slice(); if(cur && all.indexOf(cur) < 0) all.push(cur); return all.map(v=>`<option value="${esc(v)}" ${v===cur?"selected":""}>${esc(v)}</option>`).join(""); }
function showModal(w){ $("#modal").style.width = w || ""; $("#modalBg").classList.add("show"); }
function closeModal(){ $("#modalBg").classList.remove("show"); }
$("#modalBg").addEventListener("click", e=>{ if(e.target===$("#modalBg")) closeModal(); });

// 兜底：任何未捕获的异步错误都提示出来，避免「点了没反应」
window.addEventListener("unhandledrejection", (e)=>{
  const msg = (e.reason && e.reason.message) || e.reason || "未知错误";
  showMsg("操作失败：" + msg, false);
});

const tabs = { dashboard: renderDashboard, tools: renderTools, categories: renderCategories, packages: renderPackages, campaigns: renderCampaigns, orders: renderOrders,
  consumption: renderConsumption, invocations: renderInvocations, sessions: renderSessions, providers: renderProviders,
  models: renderModels, routing: renderRouting, monitor: renderMonitor, feedback: renderFeedback, users: renderUsers,
  admins: renderAdmins, accounts: renderAccounts };

// 从页面内切换到指定 tab（同步导航高亮）
function switchTab(name){
  const btn = document.querySelector(`#sidebar button[data-tab="${name}"]`);
  if(!btn) return;
  document.querySelectorAll("#sidebar button").forEach(x=>x.classList.remove("active"));
  btn.classList.add("active");
  tabs[name]();
}
document.querySelectorAll("#sidebar button").forEach(b=> b.addEventListener("click", ()=>{
  document.querySelectorAll("#sidebar button").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");
  tabs[b.dataset.tab]();
}));
$("#lg_pass").addEventListener("keydown", e=>{ if(e.key==="Enter") doLogin(); });

(async ()=>{
  if(TOKEN){ try{ ME = await api("/me"); enterApp(); return; }catch(e){ /* 令牌失效 */ } }
  $("#login").classList.add("show");
})();
</script>
